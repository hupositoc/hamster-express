<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
<title id="title">Hamster Express workflow</title>
<desc id="description">Explore a complete small gameplay loop: control a hamster, pick up cargo, deliver it to a goal, receive a reward and retain progress between sessions. Flow: Move / interact; Carry cargo; Complete delivery; Reward / save progress</desc>
